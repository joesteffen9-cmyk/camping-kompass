
name: Instagram-Reposts-Zugriff testen

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-access:
    runs-on: ubuntu-latest
    steps:
      - name: Öffentlichen Repost-Bereich prüfen
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error
          import re

          url = "https://www.instagram.com/campingkompassinfo/reposts/"
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
                  )
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  html = response.read(500000).decode(
                      "utf-8", errors="replace"
                  )

                  print("HTTP-Status:", response.status)
                  print("Endadresse:", response.url)
                  print("Antwortgröße:", len(html), "Zeichen")

                  login_redirect = "/accounts/login/" in response.url
                  print("Zur Anmeldung weitergeleitet:", login_redirect)

                  reel_links = sorted(set(re.findall(
                      r'https?://(?:www\.)?instagram\.com/reel/[^"\\\s<>]+',
                      html
                  )))

                  print("Gefundene öffentliche Reel-Links:", len(reel_links))

                  for link in reel_links[:10]:
                      print("Reel:", link)

                  if login_redirect:
                      print("ERGEBNIS: Instagram liefert die Anmeldeseite.")
                  elif reel_links:
                      print("ERGEBNIS: Reel-Links gefunden; Zugehörigkeit prüfen.")
                  else:
                      print("ERGEBNIS: Keine direkten Reel-Links gefunden.")

          except urllib.error.HTTPError as error:
              print("Instagram antwortet mit HTTP-Status:", error.code)
              print("Keine weiteren Abrufversuche in diesem Lauf.")

          except Exception as error:
              print("Abruf nicht möglich:", type(error).__name__, str(error))
          PY
